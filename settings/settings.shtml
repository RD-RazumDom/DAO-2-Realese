    <script>
        function httpGetAsync(theUrl, callback) {
            var xmlHttp = new XMLHttpRequest();
            xmlHttp.onreadystatechange = function() { 
                if (xmlHttp.readyState == 4 && xmlHttp.status == 200 && !!callback)
                    callback(xmlHttp.responseText);
            }
            xmlHttp.open("GET", theUrl, true); // true for asynchronous 
            xmlHttp.send(null);
        }
        
        function onUserChanged(res) {
            if(res.indexOf('Request complete') == -1)
                alert('Невозможно изменить учетные данные аккаунта!');
            else
                showNotification('Учетные данные успешно обновлены');
        }
    
        function onUserChange(id) {
            name = document.getElementById('user'+ id + '_name').value;
            password = document.getElementById('user'+ id + '_password').value;
            httpGetAsync('/authchange.cgi?id=' + id + '&user=' + name + '&password=' + password, onUserChanged);
        }
        
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 2000);
            }, 10);
        }
        
        function onLoad() {
            // Check for saved theme
            checkTheme();
        }
    </script>
