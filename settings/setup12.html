<html>

<head>
    <title>Настройки — Сеть</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../settings.css">
    <script src="../ldc.js"></script>
</head>

<body onload="updnet()">
    <div class="top-navbar">
        <div class="navbar-content">
            <div class="logo">
                <img src="/img/logo.png" alt="RazumDom">
            </div>
            <h1>Настройки</h1>
            <div class="header-controls">
                <button class="settings-btn" type="button" onclick="history.back()" title="Назад">
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="settings-layout">
        <aside class="settings-sidebar">
            <h2>Меню</h2>
            <ul class="settings-menu">
                <li>
                    <a href="/setup12.shtml" class="active">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        Сеть
                    </a>
                </li>
                <li>
                    <a href="/setup22.shtml">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11z"/><circle cx="17.5" cy="17.5" r="4.5"/><path d="M3 13.5h8v8H3z"/></svg>
                        Информация
                    </a>
                </li>
                <li>
                    <a href="/en/index.shtml">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Главная
                    </a>
                </li>
            </ul>
        </aside>

        <main class="settings-content">
            <h1>Настройка сети</h1>
            <p class="subtitle">Параметры подключения Ethernet-модуля</p>

            <form action="setup12.shtml" method="POST" onSubmit="s8sub()" id="MForm">
                <fieldset class="setu">
                    <legend>Сетевые параметры</legend>
                    <ol>
                        <li>
                            <label for="FW_MAC">MAC адрес</label>
                            <input id="FW_MAC" name="FW_MAC" type="text" value="<!--#FW_MAC-->">
                        </li>
                        <li>
                            <label for="CFG_IP">IPv4 адрес</label>
                            <input id="CFG_IP" name="CFG_IP" type="text" value="<!--#CFG_IP-->">
                        </li>
                        <li>
                            <label for="CFG_MASK">IPv4 маска</label>
                            <input id="CFG_MASK" name="CFG_MASK" type="text" value="<!--#CFG_MASK-->">
                        </li>
                        <li>
                            <label for="CFG_GW">IPv4 шлюз</label>
                            <input id="CFG_GW" name="CFG_GW" type="text" value="<!--#CFG_GW-->">
                        </li>
                        <li>
                            <label for="CFG_DHCP">Использовать DHCP</label>
                            <input id="CFG_DHCP" name="CFG_DHCP" type="checkbox" value="on" <!--#CFG_DHCP-->>
                        </li>
                    </ol>
                </fieldset>

                <button class="btn btn-apply" type="submit">Применить</button>
            </form>
        </main>
    </div>

    <script src="../ldn.js"></script>
</body>

</html>
